<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="Main">
    <!-- Nav Tabs -->
    <ul class="nav nav-tabs" id="tab-{data.uid}" role="tablist">
        <f:for each="{tabItems}" as="item" iteration="i">
            <li class="nav-item" role="presentation">
                <button class="nav-link {f:if(condition: i.isFirst, then: 'active')}" id="tab-btn-{item.uid}"
                    data-bs-toggle="tab" data-bs-target="#tab-pane-{item.uid}" type="button" role="tab"
                    aria-controls="tab-pane-{item.uid}"
                    aria-selected="{f:if(condition: i.isFirst, then: 'true', else: 'false')}">
                    {item.header}
                </button>
            </li>
        </f:for>
    </ul>

    <!-- Tab Content -->
    <div class="tab-content" id="tab-content-{data.uid}">
        <f:for each="{children_200}" as="child" iteration="i">
            <div class="tab-pane fade {f:if(condition: i.isFirst, then: 'show active')}" id="tab-pane-{child.data.uid}"
                role="tabpanel" aria-labelledby="tab-btn-{child.data.uid}">
                <f:format.raw>{child.renderedContent}</f:format.raw>
            </div>
        </f:for>
    </div>
</f:section>

</html>
