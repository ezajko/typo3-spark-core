<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Clean" />
<f:section name="Main">
    <div class="accordion-item">
        <h2 class="accordion-header" id="heading-{data.uid}">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                data-bs-target="#collapse-{data.uid}" aria-expanded="false" aria-controls="collapse-{data.uid}">
                {data.header}
            </button>
        </h2>
        <div id="collapse-{data.uid}" class="accordion-collapse collapse" aria-labelledby="heading-{data.uid}"
            data-bs-parent="#accordion-{data.tx_container_parent}">
            <div class="accordion-body">
                <f:for each="{children_201}" as="content">
                    <f:format.raw>{content.renderedContent}</f:format.raw>
                </f:for>
            </div>
        </div>
    </div>
</f:section>

</html>
