<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:variable name="content">
    <div class="d-flex align-items-center w-100">
        <i class="bi bi-file-earmark-text text-primary me-3 fs-3"></i>
        <div class="flex-grow-1">
            <div class="fw-medium text-dark">{item.data.header}</div>
            <f:if condition="{item.files.0}">
                <small class="text-muted text-uppercase">{item.files.0.extension} •
                    <f:format.bytes value="{item.files.0.originalFile.size}" />
                </small>
            </f:if>
        </div>
        <i class="bi bi-download text-muted ms-3"></i>
    </div>
</f:variable>
<f:render partial="ListGroup/LinkWrapper" arguments="{item: item, content: content, extraClass: 'file-list-item'}" />

</html>
