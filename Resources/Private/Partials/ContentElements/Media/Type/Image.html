<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<figure class="figure mb-0">
    <f:if condition="{file.properties.link}">
        <f:then>
            <f:link.typolink parameter="{file.properties.link}" title="{file.properties.title}" class="d-block">
                <f:media file="{file}" class="figure-img img-fluid rounded" alt="{file.properties.alternative}"
                    title="{file.properties.title}" />
            </f:link.typolink>
        </f:then>
        <f:else>
            <f:if condition="{data.image_zoom}">
                <f:then>
                    <a href="{f:uri.image(image: file)}" class="d-block glightbox" data-gallery="gallery-{data.uid}"
                        title="{file.properties.title}">
                        <f:media file="{file}" class="figure-img img-fluid rounded" alt="{file.properties.alternative}"
                            title="{file.properties.title}" />
                    </a>
                </f:then>
                <f:else>
                    <f:media file="{file}" class="figure-img img-fluid rounded" alt="{file.properties.alternative}"
                        title="{file.properties.title}" />
                </f:else>
            </f:if>
        </f:else>
    </f:if>

    <f:if condition="{file.properties.description}">
        <figcaption class="figure-caption">
            <f:format.nl2br>{file.properties.description}</f:format.nl2br>
        </figcaption>
    </f:if>
</figure>

</html>
