<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{files}">
    <f:variable name="colClass" value="col-12" />
    <f:if condition="{data.imagecols} == 2">
        <f:variable name="colClass" value="col-sm-6" />
    </f:if>
    <f:if condition="{data.imagecols} == 3">
        <f:variable name="colClass" value="col-sm-6 col-md-4" />
    </f:if>
    <f:if condition="{data.imagecols} == 4">
        <f:variable name="colClass" value="col-6 col-md-3" />
    </f:if>
    <f:if condition="{data.imagecols} == 6">
        <f:variable name="colClass" value="col-6 col-md-2" />
    </f:if>

    <div class="row g-4">
        <f:for each="{files}" as="file">
            <div class="{colClass}">
                <f:render partial="Media/Type" arguments="{file: file, data: data, settings: settings}" />
            </div>
        </f:for>
    </div>
</f:if>

</html>
