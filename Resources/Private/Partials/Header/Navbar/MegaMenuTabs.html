<li class="nav-item dropdown position-static">
    <div class="d-flex align-items-center">
        <a class="nav-link pe-1 {f:if(condition: item.active, then: 'active')}" href="{item.link}">{item.title}</a>
        <a class="nav-link dropdown-toggle dropdown-toggle-split ps-1" href="#" role="button"
            id="navbarDropdown{item.data.uid}" data-bs-toggle="dropdown" aria-expanded="false"
            data-bs-auto-close="outside">
            <span class="visually-hidden">Toggle Dropdown</span>
        </a>
        <div class="dropdown-menu w-100 shadow-lg border-0 mt-0" aria-labelledby="navbarDropdown{item.data.uid}">
            <div class="container">
                <div class="row">
                    <!-- Left Column: Vertical Tabs -->
                    <div class="col-md-3 p-0">
                        <div class="site-nav-tabs nav me-3" id="v-pills-tab-{item.data.uid}" role="tablist"
                            aria-orientation="vertical">
                            <f:for each="{item.children}" as="tab" iteration="iter">
                                <div class="nav-item">
                                    <button
                                        class="nav-link w-100 text-start rounded-0 py-3 px-4 d-flex justify-content-between align-items-center {f:if(condition: iter.isFirst, then: 'active')}"
                                        id="v-pills-{tab.data.uid}-tab" data-bs-toggle="pill"
                                        data-bs-target="#v-pills-{tab.data.uid}" type="button" role="tab"
                                        aria-controls="v-pills-{tab.data.uid}"
                                        aria-selected="{f:if(condition: iter.isFirst, then: 'true', else: 'false')}">
                                        <span class="fw-semibold text-uppercase small">{tab.title}</span>
                                        <i class="bi bi-chevron-right"></i>
                                    </button>
                                </div>
                            </f:for>
                        </div>
                    </div>

                    <!-- Right Column: Tab Content -->
                    <div class="col-md-9">
                        <div class="tab-content" id="v-pills-tabContent-{item.data.uid}" style="min-height: 400px;">
                            <f:for each="{item.children}" as="tab" iteration="iter">
                                <div class="tab-pane fade {f:if(condition: iter.isFirst, then: 'show active')}"
                                    id="v-pills-{tab.data.uid}" role="tabpanel"
                                    aria-labelledby="v-pills-{tab.data.uid}-tab">
                                    <div class="row">
                                        <f:for each="{tab.children}" as="group">
                                            <div class="col-md-4">
                                                <h6 class="text-uppercase fw-bold mb-3 text-primary">{group.title}</h6>
                                                <ul class="list-unstyled">
                                                    <f:for each="{group.children}" as="link">
                                                        <li>
                                                            <a href="{link.link}"
                                                                class="text-decoration-none mb-2 d-block">
                                                                <!-- If user puts Icon class in subtitle or similar? For now standard links -->
                                                                <f:if condition="{link.data.subtitle}">
                                                                    <i class="{link.data.subtitle} me-2 text-muted"></i>
                                                                </f:if>
                                                                {link.title}
                                                            </a>
                                                        </li>
                                                    </f:for>
                                                </ul>
                                            </div>
                                        </f:for>
                                    </div>
                                </div>
                            </f:for>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</li>
