<li class="nav-item dropdown">
    <div class="d-flex align-items-center">
        <a class="nav-link pe-1 {f:if(condition: item.active, then: 'active')}" href="{item.link}">{item.title}</a>
        <a class="nav-link dropdown-toggle dropdown-toggle-split ps-1" href="#" role="button" data-bs-toggle="dropdown"
            aria-expanded="false">
            <span class="visually-hidden">Toggle Dropdown</span>
        </a>
        <ul class="dropdown-menu shadow-lg border-0">
            <f:for each="{item.children}" as="child">
                <li><a class="dropdown-item {f:if(condition: child.active, then: 'active')}"
                        href="{child.link}">{child.title}</a></li>
            </f:for>
        </ul>
    </div>
</li>
