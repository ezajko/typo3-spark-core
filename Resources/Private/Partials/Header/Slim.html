<div class="site-nav-slim site-header-slim-wrapper">
    <div class="container">
        <div class="row align-items-center">

            <!-- Left: University Brand -->
            <f:render partial="Header/Slim/Brand" arguments="{_all}" />

            <!-- Right: Links & Language (Desktop) -->
            <div class="col-6 col-md-8 d-none d-lg-block">
                <div class="site-header-slim-right-zone d-flex justify-content-end align-items-center flex-wrap">

                    <!-- Dynamic Links (UniLinks/ServiceLinks functionality) -->
                    <f:render partial="Header/Slim/Links" arguments="{_all}" />

                    <span class="text-white-50 mx-2">|</span>

                    <!-- Language Switcher -->
                    <f:render partial="Header/Slim/Language" arguments="{_all}" />

                    <span class="text-white-50 mx-2">|</span>

                    <!-- Theme Switcher -->
                    <f:render partial="Header/ThemeSwitcher" arguments="{_all}" />
                </div>
            </div>

            <!-- Right: Mobile Toggle (Mobile) -->
            <div class="col-auto d-lg-none ms-auto">
                <button class="btn btn-link text-white p-0 text-decoration-none" type="button"
                    data-bs-toggle="offcanvas" data-bs-target="#slimMobileMenu" aria-controls="slimMobileMenu">
                    <i class="bi bi-grid-3x3-gap-fill fs-4"></i>
                </button>
            </div>

        </div>
    </div>
</div>

<!-- Mobile Menu Component -->
<f:render partial="Header/Slim/Mobile" arguments="{_all}" />
